# .github/workflows/cd-deploy.yaml
name: CD – Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy target"
        required: true
        default: "staging"
        type: choice
        options: [staging, production]

env:
  REGISTRY: asia-southeast1-docker.pkg.dev/nus-smart-scheduler/smart-scheduler
  BACKEND_IMAGE: backend
  FRONTEND_IMAGE: frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud + configure Docker auth
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: nus-smart-scheduler

      - run: gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet

      - name: Build images
        run: |
          docker build -t $REGISTRY/$BACKEND_IMAGE:${{ github.sha }} ./BackEnd
          docker build -t $REGISTRY/$FRONTEND_IMAGE:${{ github.sha }} \
            --build-arg VITE_BACKEND_URL="" ./FrontEnd

      - name: Push images
        run: |
          docker push $REGISTRY/$BACKEND_IMAGE:${{ github.sha }}
          docker push $REGISTRY/$FRONTEND_IMAGE:${{ github.sha }}

      # ── Staging：dry-run，验证 manifest 能被集群接受，不实际部署 ──────────
      # 需要 GCP 连接（get-gke-credentials），但不会改动任何线上资源。
      - name: Get GKE credentials (staging)
        if: inputs.environment == 'staging'
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: scheduler-cluster
          location: asia-southeast1
          project_id: nus-smart-scheduler

      - name: Staging dry-run
        if: inputs.environment == 'staging'
        run: |
          cd deployment/k8s/overlays/cloud
          kustomize edit set image \
            "smart_scheduler_backend=$REGISTRY/$BACKEND_IMAGE:${{ github.sha }}" \
            "smart_scheduler_frontend=$REGISTRY/$FRONTEND_IMAGE:${{ github.sha }}"
          cd $GITHUB_WORKSPACE
          kubectl apply -k deployment/k8s/overlays/cloud --dry-run=server

      - name: Staging summary
        if: inputs.environment == 'staging'
        run: |
          echo "## Staging dry-run ✅" >> $GITHUB_STEP_SUMMARY
          echo "Images built and pushed. Manifest validated against cluster." >> $GITHUB_STEP_SUMMARY
          echo "- **Image tag:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Ready to deploy → re-run with **production**." >> $GITHUB_STEP_SUMMARY

      # ── Production：真实部署 ───────────────────────────────────────────────
      - name: Get GKE credentials (production)
        if: inputs.environment == 'production'
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: scheduler-cluster
          location: asia-southeast1
          project_id: nus-smart-scheduler

      - name: Deploy to production
        if: inputs.environment == 'production'
        run: |
          # kustomize edit set image 需要在 overlay 目录里跑
          cd deployment/k8s/overlays/cloud
          kustomize edit set image \
            "smart_scheduler_backend=$REGISTRY/$BACKEND_IMAGE:${{ github.sha }}" \
            "smart_scheduler_frontend=$REGISTRY/$FRONTEND_IMAGE:${{ github.sha }}"
          cd $GITHUB_WORKSPACE

          # Secret 和 ConfigMap 必须在 kubectl apply 之前建好，
          # 否则 MySQL Pod 起来后找不到 ConfigMap 会一直 Pending（死锁）
          kubectl create secret generic app-secret \
            --from-literal=MYSQL_ROOT_PASSWORD="${{ secrets.MYSQL_PASSWORD }}" \
            --from-literal=OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            --from-literal=DB_URL="mysql+pymysql://root:${{ secrets.MYSQL_PASSWORD }}@mysql-svc:3306/${{ vars.MYSQL_DATABASE }}" \
            --from-literal=LANGFUSE_PUBLIC_KEY="${{ secrets.LANGFUSE_PUBLIC_KEY }}" \
            --from-literal=LANGFUSE_SECRET_KEY="${{ secrets.LANGFUSE_SECRET_KEY }}" \
            --from-literal=LANGFUSE_BASE_URL="${{ vars.LANGFUSE_BASE_URL }}" \
            --namespace=smart-scheduler \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create configmap mysql-initdb \
            --from-file=deployment/sql/nus_event.sql \
            --namespace=smart-scheduler \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl apply -k deployment/k8s/overlays/cloud

          kubectl rollout status deployment/mysql    -n smart-scheduler --timeout=300s
          kubectl rollout status deployment/weaviate -n smart-scheduler --timeout=300s
          kubectl rollout status deployment/backend  -n smart-scheduler --timeout=180s
          kubectl rollout status deployment/frontend -n smart-scheduler --timeout=180s

      - name: Production summary
        if: inputs.environment == 'production'
        run: |
          echo "## Production Deploy ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Image tag:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          INGRESS_IP=$(kubectl get ingress smart-scheduler-ingress \
            -n smart-scheduler \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "pending")
          echo "- **Ingress IP:** $INGRESS_IP" >> $GITHUB_STEP_SUMMARY