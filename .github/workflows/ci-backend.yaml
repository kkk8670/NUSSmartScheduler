# .github/workflows/ci-backend.yaml
name: CI – Backend

on:
  push:
    branches: [main]
    paths: [BackEnd/**]
  pull_request:
    branches: [main]
    paths: [BackEnd/**]

jobs:
  # ── Job 1: 单元测试 ────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: "sk-test-placeholder"
      DB_URL: "sqlite:///./test.db"
      JWT_SECRET_KEY: "ci-test-secret"
    defaults:
      run:
        working-directory: BackEnd

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true          # 缓存 uv 下载的包，加速后续 run

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        # --frozen: 严格按 uv.lock，CI 环境下不允许隐式更新
        # dev 依赖（pytest 等）在 pyproject.toml 的 [dev] group 里
        run: uv sync --frozen

      - name: Run tests with coverage
        run: |
          uv run pytest tests/ -v --tb=short \
            --cov=app --cov-report=term --cov-report=xml --cov-report=html \
            --ignore=tests/llm

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            BackEnd/coverage.xml
            BackEnd/htmlcov/

  # ── Job 2: SAST – bandit ───────────────────────────────────────────────────
  sast-bandit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BackEnd

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install bandit
        run: uv tool install bandit[toml]

      - name: Run bandit
        run: |
          uv tool run bandit -r app/ -ll -ii -f txt -o bandit-report.txt || true
          uv tool run bandit -r app/ -ll -ii -f json -o bandit-report.json || true
          echo "=== Bandit Report ==="
          cat bandit-report.txt

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: |
            BackEnd/bandit-report.txt
            BackEnd/bandit-report.json

  # ── Job 3: SCA – uv audit（替换 pip-audit）────────────────────────────────
  # uv 内建漏洞扫描，直接读 uv.lock，比 pip-audit 更准确（不需要先 install）
  sca-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BackEnd

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run uv audit
        # 直接扫 uv.lock，无需安装任何包
        # --format json 输出给 artifact，同时 tee 到 txt 方便看
        run: |
          uv audit 2>&1 | tee uv-audit-report.txt
          uv audit --format json > uv-audit-report.json || true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uv-audit-report
          path: |
            BackEnd/uv-audit-report.txt
            BackEnd/uv-audit-report.json

  # ── Job 4: 构建镜像 + Trivy 扫描 ──────────────────────────────────────────
  build-image:
    needs: [test, sast-bandit, sca-audit]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t smart_scheduler_backend:${{ github.sha }} ./BackEnd

      - name: Run Trivy image scan (table → console)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: smart_scheduler_backend:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Run Trivy image scan (json → artifact)
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: smart_scheduler_backend:${{ github.sha }}
          format: json
          output: trivy-report.json
          exit-code: "0"
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json