# deployment/k8s/overlays/cloud/kustomization.yaml
# HTTP 版本，开箱即用，无需填写任何变量。
# HTTPS 所需的 ManagedCertificate 和 static-ip annotation 由 deploy.sh 在运行时注入，
# 不需要修改此文件。

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - 32-gce-ingress-resources.yaml

images:
  - name: smart_scheduler_backend
    newName: asia-southeast1-docker.pkg.dev/nus-smart-scheduler/smart-scheduler/backend
    newTag: "1.0.0"
  - name: smart_scheduler_frontend
    newName: asia-southeast1-docker.pkg.dev/nus-smart-scheduler/smart-scheduler/frontend
    newTag: "1.0.0"

patches:
  - target:
      kind: PersistentVolumeClaim
      name: mysql-pvc
    patch: |-
      - op: replace
        path: /spec/storageClassName
        value: standard-rwo

  - target:
      kind: PersistentVolumeClaim
      name: weaviate-pvc
    patch: |-
      - op: replace
        path: /spec/storageClassName
        value: standard-rwo

  - target:
      kind: Ingress
      name: smart-scheduler-ingress
    patch: |-
      - op: replace
        path: /spec/ingressClassName
        value: gce
      - op: remove
        path: /spec/rules/0/host

  - target:
      kind: Service
      name: backend-svc
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          cloud.google.com/backend-config: '{"default":"backend-backendconfig"}'

  - target:
      kind: Service
      name: frontend-svc
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          cloud.google.com/backend-config: '{"default":"frontend-backendconfig"}'

  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always

  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always

  - target:
      kind: Deployment
      name: weaviate
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always

  - target:
      kind: Deployment
      name: mysql
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
      - op: replace
        path: /spec/template/spec/volumes/0
        value:
          name: mysql-storage
          persistentVolumeClaim:
            claimName: mysql-pvc