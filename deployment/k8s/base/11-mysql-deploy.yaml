# deployment/k8s/base/11-mysql-deploy.yaml
#
# ── Hardening + intentional skips (see §3.4) ───────────────────────────────
# MySQL is a stateful database with constraints from the upstream image.
# We apply what we can (resources, probes, automount=false) and explicitly
# skip checks that conflict with how the official mysql:8.0 image works:
#
#   ✗ CKV_K8S_22 (read-only rootFS):  mysqld writes to /var/lib/mysql
#   ✗ CKV_K8S_23 (non-root):          init scripts in upstream image require
#                                     root to chown /var/lib/mysql
#   ✗ CKV_K8S_29 / CKV_K8S_30:        partial — we apply runAsNonRoot=false
#                                     intentionally, so a stricter context
#                                     is incompatible
#   ✗ CKV_K8S_35 (secrets as files):  intentional design choice (see §2.4)
#                                     — env-based secret injection is the
#                                     project-wide convention
#   ✗ CKV_K8S_40 (high UID):          mysql user is UID 999 (set by upstream)
#   ✗ CKV_K8S_43 (image digest):      same as application pods
#
# Mitigation for the skipped items: NetworkPolicy restricts mysql ingress
# to backend pods only (see 31-network-policy.yaml), and the database is
# never exposed outside the cluster.
# ──────────────────────────────────────────────────────────────────────────

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: smart-scheduler
  annotations:
    checkov.io/skip1:  CKV_K8S_22=mysqld must write to /var/lib/mysql; rootFS RO breaks startup
    checkov.io/skip2:  CKV_K8S_23=Upstream mysql:8.0 init scripts require root; mitigated by NetworkPolicy
    checkov.io/skip3:  CKV_K8S_29=Upstream image incompatible with non-root pod context
    checkov.io/skip4:  CKV_K8S_30=Same as CKV_K8S_29 — container security context conflicts with init
    checkov.io/skip5:  CKV_K8S_35=Env-based secret injection is project convention (see report 2.4)
    checkov.io/skip6:  CKV_K8S_40=Upstream mysql user is UID 999 (not >10000)
    checkov.io/skip7:  CKV_K8S_43=Image digest pinning deferred to cloud overlay (see report 4.4)
    checkov.io/skip8:  CKV_K8S_15=imagePullPolicy IfNotPresent is intentional for local dev (see report 4.2); cloud overlay patches to Always
    checkov.io/skip9:  CKV_K8S_25=mysqld requires SETGID + SETUID to switch from root entrypoint to mysql user; all other caps dropped
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      automountServiceAccountToken: false        # CKV_K8S_38 — applies regardless

      # Pod-level: run as mysql user (UID 999) from the start.
      # Rationale: macOS Docker Desktop's volume bridge denies chown/chmod
      # even with CHOWN capability. Both fsGroup and an initContainer-based
      # chown approach were tested and failed on this platform. Running as
      # UID 999 from the start bypasses the entrypoint's chown step entirely.
      # The cloud overlay reverts this to root entrypoint + fsGroup (which
      # works correctly on real K8s distributions like EKS/GKE).
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch

      # Volume strategy: emptyDir for local (Docker Desktop chown bug).
      # Cloud overlay patches this back to a real PVC.
      containers:
        - name: mysql
          image: mysql:8.0           # CKV_K8S_14 (semver-pinned, not :latest)
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3306
              name: mysql

          # Container hardening — full drop, no add.
          # Since we now run as mysql user from the start, we don't need
          # SETGID/SETUID for the entrypoint user-switch (it never happens).
          securityContext:
            allowPrivilegeEscalation: false      # CKV_K8S_20
            capabilities:
              drop: ["ALL"]                      # CKV_K8S_28/37
            seccompProfile:
              type: RuntimeDefault               # CKV_K8S_31

          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: MYSQL_DATABASE
            - name: TZ
              value: "Asia/Singapore"
          args: ["--default-time-zone=+08:00"]

          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true

          # CKV_K8S_10/11/12/13: resources
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          # CKV_K8S_8: liveness — exec mysqladmin ping (port may not be
          # bound yet during startup, so livenessProbe uses tcpSocket as
          # a kinder check than HTTP).
          livenessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          # CKV_K8S_9: readiness — gates Service traffic.
          readinessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

      volumes:
        - name: mysql-storage
          # See note above: emptyDir for local dev (Docker Desktop on macOS).
          # Cloud overlay patches this back to PVC + fsGroup (works on EKS/GKE).
          emptyDir:
            sizeLimit: 1Gi
        - name: init-sql
          configMap:
            name: mysql-initdb

---
apiVersion: v1
kind: Service
metadata:
  name: mysql-svc
  namespace: smart-scheduler
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306