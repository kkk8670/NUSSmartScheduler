# deployment/k8s/base/11-mysql-deploy.yaml
#
# ── Hardening + intentional skips (see §3.4) ───────────────────────────────
# MySQL is a stateful database with constraints from the upstream image.
# We apply what we can (resources, probes, automount=false) and explicitly
# skip checks that conflict with how the official mysql:8.0 image works:
#
#   ✗ CKV_K8S_22 (read-only rootFS):  mysqld writes to /var/lib/mysql
#   ✗ CKV_K8S_23 (non-root):          mysql user is UID 999 (not >10000)
#   ✗ CKV_K8S_29 / CKV_K8S_30:        partial — runAsNonRoot=false required
#                                     for initContainer (UID 0)
#   ✗ CKV_K8S_35 (secrets as files):  env-based secret injection is the
#                                     project-wide convention (see §2.4)
#   ✗ CKV_K8S_40 (high UID):          mysql user is UID 999 (set by upstream)
#   ✗ CKV_K8S_43 (image digest):      deferred to cloud overlay (see §4.4)
#
# ── chown strategy ──────────────────────────────────────────────────────────
# initContainer fix-permissions (UID 0, CHOWN + DAC_OVERRIDE only) runs
# first to chown /var/lib/mysql to 999:999, then exits.
# Main container runs as UID 999 with drop ALL — no CHOWN or SETUID needed.
# This approach works on both local (emptyDir) and cloud (PVC) without any
# platform-specific workarounds.
# ──────────────────────────────────────────────────────────────────────────

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: smart-scheduler
  annotations:
    checkov.io/skip1: CKV_K8S_22=mysqld must write to /var/lib/mysql; rootFS RO breaks startup
    checkov.io/skip2: CKV_K8S_23=mysql user is UID 999; chown handled by initContainer (not main container)
    checkov.io/skip3: CKV_K8S_29=initContainer requires runAsNonRoot=false (UID 0 for chown); main container is UID 999
    checkov.io/skip4: CKV_K8S_30=Same as CKV_K8S_29
    checkov.io/skip5: CKV_K8S_35=Env-based secret injection is project convention (see report 2.4)
    checkov.io/skip6: CKV_K8S_40=Upstream mysql user is UID 999 (not >10000)
    checkov.io/skip7: CKV_K8S_43=Image digest pinning deferred to cloud overlay (see report 4.4)
    checkov.io/skip8: CKV_K8S_15=imagePullPolicy IfNotPresent is intentional for local dev; cloud overlay patches to Always
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      automountServiceAccountToken: false

      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch

      # initContainer: chown /var/lib/mysql to 999:999 before mysqld starts.
      # Runs as root with minimal capabilities (CHOWN + DAC_OVERRIDE only).
      # Exits immediately after chown — does not stay alive.
      # Works on both emptyDir (local) and PVC (cloud) without modification.
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 999:999 /var/lib/mysql"]
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql

      containers:
        - name: mysql
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3306
              name: mysql

          # Main container: drop ALL, no extra capabilities needed.
          # chown was already done by initContainer.
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault

          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: MYSQL_DATABASE
            - name: TZ
              value: "Asia/Singapore"
          args: ["--default-time-zone=+08:00"]

          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

      volumes:
        - name: mysql-storage
          emptyDir:
            sizeLimit: 1Gi
        - name: init-sql
          configMap:
            name: mysql-initdb

---
apiVersion: v1
kind: Service
metadata:
  name: mysql-svc
  namespace: smart-scheduler
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306