# deployment/k8s/base/20-backend-deploy.yaml
#
# ── Purpose ────────────────────────────────────────────────────────────────
# Backend Deployment + Service.
#
# ── Hardening (per checkov scan, see §3.4) ─────────────────────────────────
# This file applies the K8s baseline hardening:
#   - Resource requests + limits         (CKV_K8S_10/11/12/13)
#   - Liveness + readiness probes        (CKV_K8S_8/9)
#   - Pinned image tag (no :latest)      (CKV_K8S_14)
#   - Pod-level securityContext          (CKV_K8S_29) — non-root, high UID
#   - Container-level securityContext    (CKV_K8S_30) — drop ALL caps,
#                                                       no privilege escalation,
#                                                       read-only root FS,
#                                                       seccomp RuntimeDefault
#   - automountServiceAccountToken=false (CKV_K8S_38)
#
# Skipped checks (with explicit reason inline):
#   - CKV_K8S_43 (image digest pinning):  deferred to production cloud overlay
#                                         where a real registry is configured.
# ──────────────────────────────────────────────────────────────────────────

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: smart-scheduler
  annotations:
    # Image-digest pinning requires a real container registry (e.g. ECR/GCR)
    # which is out of scope for the local k3s/Docker-Desktop overlay. The
    # production overlay (deployment/k8s/overlays/cloud) will add a Kustomize
    # patch substituting the digest at apply time.
    checkov.io/skip1: CKV_K8S_43=Image digest pinning deferred to cloud overlay (see report 4.4)
    checkov.io/skip2: CKV_K8S_15=imagePullPolicy IfNotPresent is intentional for local dev (see report 4.2); cloud overlay patches to Always
    checkov.io/skip3: CKV_K8S_35=Env-based secret injection is project-wide convention (see report 2.4)
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "8000"
        prometheus.io/path:   "/metrics"
    spec:
      # CKV_K8S_38: no app code calls the K8s API; SA token would only be
      # extra attack surface if the pod were compromised.
      automountServiceAccountToken: false

      # CKV_K8S_29: pod-level securityContext (defaults for all containers)
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001        # high UID, see Dockerfile (CKV_K8S_40)
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault   # CKV_K8S_31

      containers:
        - name: backend
          # Pinned tag (CKV_K8S_14). The CD pipeline overrides this via
          # `kubectl set image` to ${github.sha} on each deploy. The base
          # value here is the "known-good" fallback for `kubectl apply` only.
          image: smart_scheduler_backend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http

          # CKV_K8S_30: container-level securityContext (defense in depth)
          securityContext:
            allowPrivilegeEscalation: false   # CKV_K8S_20
            readOnlyRootFilesystem: true      # CKV_K8S_22
            capabilities:
              drop: ["ALL"]                   # CKV_K8S_28/37

          # FastAPI/uvicorn writes nothing to disk in production except
          # /tmp (httpx temp downloads, etc.). Mount tmpfs there so the
          # rootfs can stay read-only.
          volumeMounts:
            - name: tmp
              mountPath: /tmp

          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DB_URL
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: OPENAI_API_KEY
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: LANGFUSE_PUBLIC_KEY
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: LANGFUSE_SECRET_KEY
            - name: LANGFUSE_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: LANGFUSE_BASE_URL

          # CKV_K8S_10/11/12/13: resource requests + limits.
          # Sized for local dev (Docker Desktop); cloud overlay can patch.
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"

          # CKV_K8S_8: liveness probe — restarts pod if uvicorn hangs.
          livenessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          # CKV_K8S_9: readiness probe — gates Service traffic routing.
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi

---
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: smart-scheduler
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - name: http-metrics
      port: 8000
      targetPort: 8000