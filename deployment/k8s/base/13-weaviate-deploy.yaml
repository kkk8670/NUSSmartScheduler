# deployment/k8s/base/13-weaviate-deploy.yaml
#
# ── Hardening + intentional skips (see §3.4) ───────────────────────────────
# Same constraint pattern as MySQL: stateful DB, upstream image expectations.
# Weaviate writes to /var/lib/weaviate and (per cr.weaviate.io image) starts
# as root before dropping. We apply what's compatible.
#
#   ✗ CKV_K8S_22 (read-only rootFS):  weaviate writes data + index files
#   ✗ CKV_K8S_23 (non-root):          upstream image starts as root
#   ✗ CKV_K8S_29 / CKV_K8S_30:        partial application (see below)
#   ✗ CKV_K8S_40 (high UID):          upstream image's user is UID 1000
#   ✗ CKV_K8S_43 (image digest):      deferred to cloud overlay
#
# Mitigation: NetworkPolicy restricts weaviate ingress to backend pods only.
#
# ── Raft / cluster IP 冲突根治 ─────────────────────────────────────────────
# Weaviate 1.26+ 默认启用 Raft，把 Pod IP 写进 PVC 作为节点标识。
# Pod 重建后 IP 变化，Weaviate 认为自己是新节点，无法加入旧集群，
# 导致 "could not join a cluster" 循环报错。
#
# 解决方案：
#   CLUSTER_HOSTNAME=weaviate-node  固定节点名，不随 Pod IP 变化
#   RAFT_BOOTSTRAP_EXPECT=1         声明单节点集群，不等待其他节点
#   CLUSTER_GOSSIP_BIND_PORT=7100   避免与默认端口冲突
# ──────────────────────────────────────────────────────────────────────────

apiVersion: apps/v1
kind: Deployment
metadata:
  name: weaviate
  namespace: smart-scheduler
  annotations:
    checkov.io/skip1: CKV_K8S_22=weaviate persists vector data + indexes; rootFS RO incompatible
    checkov.io/skip2: CKV_K8S_23=Upstream weaviate image starts as root; mitigated by NetworkPolicy
    checkov.io/skip3: CKV_K8S_29=Upstream image incompatible with non-root pod context
    checkov.io/skip4: CKV_K8S_30=Same as CKV_K8S_29 — container security context conflicts
    checkov.io/skip5: CKV_K8S_40=Upstream weaviate user is UID 1000 (not >10000)
    checkov.io/skip6: CKV_K8S_43=Image digest pinning deferred to cloud overlay (see report 4.4)
    checkov.io/skip7: CKV_K8S_15=imagePullPolicy IfNotPresent is intentional for local dev (see report 4.2); cloud overlay patches to Always
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: weaviate
  template:
    metadata:
      labels:
        app: weaviate
    spec:
      automountServiceAccountToken: false

      containers:
        - name: weaviate
          image: cr.weaviate.io/semitechnologies/weaviate:1.26.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 50051
              name: grpc

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault

          env:
            - name: AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED
              value: "true"
            - name: PERSISTENCE_DATA_PATH
              value: /var/lib/weaviate
            - name: ENABLE_API_BASED_MODULES
              value: "false"
            # ── Raft 单节点固定配置，防止 Pod IP 变化导致集群冲突 ──────────
            # CLUSTER_HOSTNAME: 固定节点名称，不使用 Pod IP
            # RAFT_BOOTSTRAP_EXPECT: 声明单节点，不等待其他节点加入
            # CLUSTER_JOIN: 空值，明确不加入任何外部集群
            - name: CLUSTER_HOSTNAME
              value: "weaviate-node"
            - name: RAFT_BOOTSTRAP_EXPECT
              value: "1"
            - name: CLUSTER_JOIN
              value: ""

          volumeMounts:
            - name: weaviate-storage
              mountPath: /var/lib/weaviate

          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

          livenessProbe:
            httpGet:
              path: /v1/.well-known/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /v1/.well-known/ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

      volumes:
        - name: weaviate-storage
          persistentVolumeClaim:
            claimName: weaviate-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: weaviate-svc
  namespace: smart-scheduler
spec:
  selector:
    app: weaviate
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 50051
      targetPort: 50051