[pytest]
# pytest.ini  

# test path
testpaths = tests

# asyn support
asyncio_mode = auto

# custom markers (to avoid PytestUnknownMarkWarning)
markers =
    llm: LLM-specific test, requires real OPENAI_API_KEY, skipped by CI by default
    integration: integration test, requires full service startup
    unit: pure unit tests, no external dependencies

# output format
addopts =
    -v
    --tb=short
    --strict-markers
    -m "not llm and not integration"

# log
log_cli = false
log_level = WARNING